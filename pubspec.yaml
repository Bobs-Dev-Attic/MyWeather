name: myweather
description: A Flutter weather app aggregating multiple free weather sources with rich animations, forecasts and historical charts.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Networking
  http: ^1.2.2

  # Persistence
  shared_preferences: ^2.3.2

  # Location
  geolocator: ^13.0.1

  # Charts
  fl_chart: ^0.69.0

  # Formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
